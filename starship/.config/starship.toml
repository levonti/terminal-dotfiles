# Shared prompt: directory emphasis, quieter shell label, explicit Git counts.
add_newline = true
format = '$hostname$shell${custom.kube_environment}$directory${custom.git_branch}$git_status$line_break$character'
right_format = '$status$cmd_duration'

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = 'bold #a3be8c'

[shell]
disabled = false
bash_indicator = 'bash'
zsh_indicator = 'zsh'
format = '[$indicator]($style) '
style = '#a2adbd'

[directory]
truncation_length = 3
truncation_symbol = '…/'
format = '[ $path]($style)[$read_only]($read_only_style) '
repo_root_format = '[ $repo_root$path]($style)[$read_only]($read_only_style) '
style = 'bold #88c0d0'
repo_root_style = 'bold #88c0d0'

[custom.git_branch]
require_repo = true
when = true
shell = ['bash', '--noprofile', '--norc']
format = '([│](#626f82) [ $output]($style) )'
style = '#b48ead'
command = '''
shorten() {
    if (( ${#1} > 18 )); then
        printf '%s…%s' "${1:0:3}" "${1: -14}"
    else
        printf '%s' "$1"
    fi
}

branch=$(git branch --show-current) || exit 1
if [[ -z $branch ]]; then
    printf 'HEAD'
    exit
fi

shorten "$branch"
upstream=$(git for-each-ref --format='%(upstream:remoteref)' "refs/heads/$branch") || exit 0
upstream=${upstream#refs/heads/}
if [[ -n $upstream && $upstream != "$branch" ]]; then
    printf ':'
    shorten "$upstream"
fi
'''

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = '#ebcb8b'
conflicted = '[conflict:$count](bold #bf616a) '
ahead = '↑$count '
behind = '↓$count '
diverged = '↑$ahead_count ↓$behind_count '
untracked = '?$count '
stashed = 'stash:$count '
modified = '~$count '
staged = '+$count '
renamed = 'rename:$count '
deleted = '-$count '

[custom.kube_environment]
when = 'test -n "$KUBIE_ACTIVE"'
command = '"$HOME/.config/terminal-dotfiles/kube-environment"'
format = '([󱃾](#a2adbd) $output [│](#626f82) )'
shell = ['sh']

[status]
disabled = false
format = '[exit:$status]($style) '
style = '#bf616a'

[cmd_duration]
format = '[$duration]($style) '
style = '#a2adbd'

[character]
success_symbol = '[❯](#a3be8c)'
error_symbol = '[❯](#bf616a)'

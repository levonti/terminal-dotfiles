# Shared prompt: directory emphasis, quieter shell label, explicit Git counts.
add_newline = true
format = '$hostname$shell$kubernetes$directory$git_branch$git_status$line_break$character'
right_format = '$status$cmd_duration'

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = 'bold #a3be8c'

[shell]
disabled = false
bash_indicator = 'bash'
zsh_indicator = 'zsh'
format = '[$indicator]($style) '
style = '#a2adbd'

[directory]
truncation_length = 3
truncation_symbol = '…/'
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_format = '[$repo_root$path]($style)[$read_only]($read_only_style) '
style = 'bold #88c0d0'
repo_root_style = 'bold #88c0d0'

[git_branch]
symbol = 'git:'
format = '[$symbol$branch(:$remote_branch)]($style) '
style = '#b48ead'

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = '#ebcb8b'
conflicted = '[conflict:$count](bold #bf616a) '
ahead = '↑$count '
behind = '↓$count '
diverged = '↑$ahead_count ↓$behind_count '
untracked = '?$count '
stashed = 'stash:$count '
modified = '~$count '
staged = '+$count '
renamed = 'rename:$count '
deleted = '-$count '

[kubernetes]
disabled = false
# Display only the context explicitly selected in this Kubie session.
detect_env_vars = ['KUBIE_ACTIVE']
format = '[\[☸ $symbol$context(::$namespace)\]]($style) '
symbol = '? ENV '
style = 'bold #b48ead'

[[kubernetes.contexts]]
context_pattern = 'dev[/:](?:[^/]+/)*([^/]+)'
context_alias = 'DEV $1'
symbol = ''
style = 'bold #a3be8c'

[[kubernetes.contexts]]
context_pattern = 'test[/:](?:[^/]+/)*([^/]+)'
context_alias = 'TEST $1'
symbol = ''
style = 'bold #ebcb8b'

[[kubernetes.contexts]]
context_pattern = 'prod[/:](?:[^/]+/)*([^/]+)'
context_alias = 'PROD $1'
symbol = '! '
style = 'bold fg:#ffffff bg:#bf616a'

[[kubernetes.contexts]]
# Keep unknown environments conspicuous without displaying path-like prefixes.
context_pattern = '(?:[^/]+/)*([^/]+)'
context_alias = '$1'

[status]
disabled = false
format = '[exit:$status]($style) '
style = '#bf616a'

[cmd_duration]
format = '[$duration]($style) '
style = '#a2adbd'

[character]
success_symbol = '[❯](#a3be8c)'
error_symbol = '[❯](#bf616a)'

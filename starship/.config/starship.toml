# The same prompt on macOS and Linux. Current directory and Git data remain dynamic.
add_newline = false
format = '$hostname$shell$directory$git_branch$git_status$kubernetes$line_break$character'
right_format = '$status$cmd_duration'

[hostname]
ssh_only = true
format = '[$hostname]($style) '

[shell]
disabled = false
bash_indicator = 'bash'
zsh_indicator = 'zsh'
format = '[$indicator]($style) '
style = 'bold cyan'

[directory]
truncation_length = 3
truncation_symbol = '…/'

[git_branch]
symbol = 'git:'

[kubernetes]
disabled = false
detect_env_vars = ['KUBIE_ACTIVE']
format = '[$symbol$context( \($namespace\))]($style) '
style = 'bold #ebcb8b'

[status]
disabled = false

[character]
success_symbol = '[❯](green)'
error_symbol = '[❯](red)'

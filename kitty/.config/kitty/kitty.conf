# Shared macOS/Linux terminal appearance and keyboard workflow.
font_family MesloLGS NF
font_size 15.0

foreground #d8dee9
background #1f2430
selection_foreground #1f2430
selection_background #88c0d0
cursor #88c0d0
color0 #2e3440
color1 #bf616a
color2 #a3be8c
color3 #ebcb8b
color4 #81a1c1
color5 #b48ead
color6 #88c0d0
color7 #e5e9f0
color8 #4c566a
color9 #bf616a
color10 #a3be8c
color11 #ebcb8b
color12 #81a1c1
color13 #b48ead
color14 #8fbcbb
color15 #eceff4

background_opacity 1.0
window_padding_width 12
cursor_shape beam
macos_titlebar_color #171b24
tab_bar_edge top
# High-contrast tabs: one accent, compact labels, and visible boundaries.
tab_bar_style fade
tab_fade 1
tab_bar_margin_width 8
tab_bar_margin_height 6 6
tab_bar_background #171b24
tab_bar_margin_color #171b24
active_tab_foreground #d8dee9
active_tab_background #303949
active_tab_font_style normal
inactive_tab_foreground #b9c3d4
inactive_tab_background #252c3a
inactive_tab_font_style normal
# Shared title logic in tab_bar.py preserves identity when focus changes.
tab_title_template " {index} {custom} "
# Keep focus visible under the title while leaving the environment badge distinct.
active_tab_title_template " \x1b[4m\x1b[58:2::136:192:208m{fmt.bold}{index}{fmt.nobold} {custom}\x1b[24;59m "
tab_title_max_length 40
enable_audio_bell no
shell_integration enabled

# Use the system clipboard on both platforms, including SSH sessions.
copy_on_select clipboard
detect_urls yes
open_url_with default
show_hyperlink_targets always

# Command/Super+click opens links even when the terminal program grabs the mouse.
mouse_map super+left press grabbed discard_event
mouse_map super+left release grabbed,ungrabbed mouse_handle_click link

# macOS Fn+Left/Right produce Home/End: pass them to the program.
# Fn+Up/Down still scroll the terminal output.
map page_up scroll_page_up
map page_down scroll_page_down

# Command on macOS and Super/Meta on Linux use the same shortcuts.
map --allow-fallback=shifted,ascii super+t new_tab
map --allow-fallback=shifted,ascii super+n new_os_window
map --allow-fallback=shifted,ascii super+w close_tab
map super+enter new_window
map --allow-fallback=shifted,ascii super+shift+d close_window
map super+right next_tab
map super+left previous_tab
map --allow-fallback=shifted,ascii super+shift+] next_tab
map --allow-fallback=shifted,ascii super+shift+[ previous_tab
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+5 goto_tab 5
map super+6 goto_tab 6
map super+7 goto_tab 7
map super+8 goto_tab 8
map super+9 goto_tab 9
map --allow-fallback=shifted,ascii super+p select_tab
map --allow-fallback=shifted,ascii super+shift+t set_tab_title
map --allow-fallback=shifted,ascii super+c copy_or_noop
map --allow-fallback=shifted,ascii super+v paste_from_clipboard
map --allow-fallback=shifted,ascii super+f search_scrollback
map --allow-fallback=shifted,ascii super+, edit_config_file

# Load Ubuntu tab shortcuts and network panel defaults before per-device overrides.
geninclude tab_bar.py
globinclude kitty.local.conf
globinclude terminal-dotfiles-network.conf

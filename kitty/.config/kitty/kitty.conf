# Shared macOS/Linux terminal appearance and keyboard workflow.
font_family MesloLGS NF
font_size 15.0

foreground #d8dee9
background #1f2430
selection_foreground #1f2430
selection_background #88c0d0
cursor #88c0d0
color0 #2e3440
color1 #bf616a
color2 #a3be8c
color3 #ebcb8b
color4 #81a1c1
color5 #b48ead
color6 #88c0d0
color7 #e5e9f0
color8 #4c566a
color9 #bf616a
color10 #a3be8c
color11 #ebcb8b
color12 #81a1c1
color13 #b48ead
color14 #8fbcbb
color15 #eceff4

background_opacity 1.0
window_padding_width 6
cursor_shape beam
tab_bar_edge top
tab_bar_style powerline
enable_audio_bell no
shell_integration enabled

# macOS Fn+arrows produce Home/End/PageUp/PageDown; scroll shell output.
map home scroll_home
map end scroll_end
map page_up scroll_page_up
map page_down scroll_page_down

# Command on macOS and Super/Meta on Linux use the same shortcuts.
map --allow-fallback=shifted,ascii super+t new_tab
map --allow-fallback=shifted,ascii super+n new_os_window
map --allow-fallback=shifted,ascii super+w close_tab
map super+enter new_window
map --allow-fallback=shifted,ascii super+shift+d close_window
map super+right next_tab
map super+left previous_tab
map --allow-fallback=shifted,ascii super+shift+] next_tab
map --allow-fallback=shifted,ascii super+shift+[ previous_tab
map --allow-fallback=shifted,ascii super+c copy_or_noop
map --allow-fallback=shifted,ascii super+v paste_from_clipboard
map --allow-fallback=shifted,ascii super+f search_scrollback
map --allow-fallback=shifted,ascii super+, edit_config_file

# Optional per-device overrides; the absolute path also works with Stow links.
globinclude ${HOME}/.config/kitty/kitty.local.conf
